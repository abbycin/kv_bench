[package]
name = "kv_bench"
version = "0.1.0"
edition = "2024"

[dependencies]
mace-kv = "*"
fjall = "3"
surrealkv = "1"
tokio = { version = "1.36", features = ["rt-multi-thread", "time"] }
clap = { version = "4.5.48", features = ["derive"] }
parking_lot = "0.12"
rand = "0.9.2"
log = "0.4.22"
coreid = { path = "coreid" }

[profile.release]
lto = true
opt-level = 3
debug = true
panic = "abort"
